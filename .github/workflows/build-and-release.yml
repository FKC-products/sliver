name: Build and Release Sliver Binaries

on:
  workflow_dispatch:  # Manual trigger
    inputs:
      create_release:
        description: 'Create GitHub release with binaries'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches:
      - master

jobs:
  build-sliver:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: Free disk space
        run: |
          echo "Disk space before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af

          echo "Disk space after cleanup:"
          df -h

      - name: Checkout Sliver
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install MinGW
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Log build info
        run: |
          ACTUAL_COMMIT=$(git rev-parse HEAD)
          echo "Building commit: $ACTUAL_COMMIT"
          echo "Branch: ${{ github.ref_name }}"
          echo "Architecture: ${{ matrix.arch }}"
          echo "✓ Building Sliver with sleep obfuscation support"

      - name: Build Sliver for ${{ matrix.arch }}
        run: |
          echo "Building Sliver for linux/${{ matrix.arch }} with sleep obfuscation support..."
          GOOS=linux GOARCH=${{ matrix.arch }} ARTIFACT_SUFFIX="_linux-${{ matrix.arch }}" make

          echo "✓ Build complete"
          ls -lh sliver-server_linux-${{ matrix.arch }} sliver-client_linux-${{ matrix.arch }}

      - name: Generate checksums
        run: |
          # Generate SHA256 checksums
          sha256sum sliver-server_linux-${{ matrix.arch }} sliver-client_linux-${{ matrix.arch }} > checksums-${{ matrix.arch }}.txt

          echo "=== ${{ matrix.arch }} Checksums ==="
          cat checksums-${{ matrix.arch }}.txt

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sliver-${{ github.ref_name }}-${{ matrix.arch }}
          path: |
            sliver-server_linux-${{ matrix.arch }}
            sliver-client_linux-${{ matrix.arch }}
            checksums-${{ matrix.arch }}.txt
          retention-days: 90

  create-release:
    needs: build-sliver
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true')

    steps:
      - name: Checkout Sliver
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Consolidate binaries
        run: |
          mkdir -p release

          # Move all binaries to release directory
          mv artifacts/sliver-${{ github.ref_name }}-amd64/sliver-server_linux-amd64 release/
          mv artifacts/sliver-${{ github.ref_name }}-amd64/sliver-client_linux-amd64 release/
          mv artifacts/sliver-${{ github.ref_name }}-arm64/sliver-server_linux-arm64 release/
          mv artifacts/sliver-${{ github.ref_name }}-arm64/sliver-client_linux-arm64 release/

          # Combine checksums
          cat artifacts/sliver-${{ github.ref_name }}-amd64/checksums-amd64.txt > release/checksums.txt
          cat artifacts/sliver-${{ github.ref_name }}-arm64/checksums-arm64.txt >> release/checksums.txt

          echo "=== All binaries ==="
          ls -lh release/
          echo ""
          echo "=== Combined checksums ==="
          cat release/checksums.txt

      - name: Generate metadata
        run: |
          cd release

          # Create metadata file
          echo "Sliver Binaries - AAE Custom Build" > metadata.txt
          echo "===================================" >> metadata.txt
          echo "" >> metadata.txt
          echo "Source Repository: https://github.com/FKC-products/sliver" >> metadata.txt
          echo "Branch:            ${{ github.ref_name }}" >> metadata.txt
          echo "Commit:            $(git rev-parse HEAD)" >> metadata.txt
          echo "Commit (short):    $(git rev-parse --short HEAD)" >> metadata.txt
          echo "Build Date:        $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> metadata.txt
          echo "Built By:          GitHub Actions" >> metadata.txt
          echo "Builder Run:       ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> metadata.txt
          echo "" >> metadata.txt
          echo "Architectures:" >> metadata.txt
          echo "- linux/amd64" >> metadata.txt
          echo "- linux/arm64" >> metadata.txt
          echo "" >> metadata.txt
          echo "Features:" >> metadata.txt
          echo "- Sleep-time memory obfuscation (Ekko/Hourglass technique)" >> metadata.txt
          echo "- Windows implant support" >> metadata.txt
          echo "- --sleep-obfuscation flag available" >> metadata.txt
          echo "" >> metadata.txt
          echo "SHA256 Checksums:" >> metadata.txt
          cat checksums.txt >> metadata.txt

          echo "=== Metadata ==="
          cat metadata.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release

          # Building from master with sleep obfuscation
          TAG="sliver-aae-v1.0"
          TITLE="Sliver AAE v1.0 - Sleep Obfuscation (Multi-Arch)"

          echo "Creating release: $TAG"

          # Check if release already exists
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, deleting..."
            gh release delete "$TAG" --yes
          fi

          # Create the release
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file metadata.txt \
            sliver-server_linux-amd64 \
            sliver-client_linux-amd64 \
            sliver-server_linux-arm64 \
            sliver-client_linux-arm64 \
            checksums.txt

          echo "✓ Release created: $TAG"
          echo "📦 Download from: https://github.com/FKC-products/sliver/releases/tag/$TAG"

      - name: Build summary
        run: |
          cd release

          echo "### ✅ Sliver Multi-Arch Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** $(git rev-parse --short HEAD)" >> $GITHUB_STEP_SUMMARY
          echo "**Architectures:** linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**SHA256 Checksums:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat checksums.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Release:** https://github.com/FKC-products/sliver/releases/tag/sliver-aae-v1.0" >> $GITHUB_STEP_SUMMARY
